<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" width="960" height="744" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="743" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- Шапка -->
  <g transform="translate(40 34) scale(0.5625)">
    <rect width="64" height="64" rx="14" fill="#1F4E3D"/>
    <circle cx="32" cy="32" r="6.5" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5"/>
    <g fill="#fff">
      <circle cx="32" cy="16" r="5.5"/>
      <circle cx="47.22" cy="27.06" r="5.5"/>
      <circle cx="22.6" cy="44.94" r="5.5"/>
      <circle cx="16.78" cy="27.06" r="5.5"/>
    </g>
    <circle cx="41.4" cy="44.94" r="5.5" fill="#F2B84B"/>
  </g>
  <text x="90" y="58" font-size="22" font-weight="700" fill="#1F2328">Кворум: повышение цен на 15%</text>
  <text x="90" y="81" font-size="14" fill="#59636E">Режим: полный · 2026-10-15</text>
  <line x1="40" y1="106" x2="920" y2="106" stroke="#D8DEE4"/>

  <!-- Разногласия -->
  <text x="40" y="140" font-size="12" font-weight="600" letter-spacing="1.2" fill="#59636E">РАЗНОГЛАСИЯ</text>
  <rect x="40" y="152" width="4" height="152" rx="2" fill="#F2B84B"/>
  <text x="58" y="170" font-size="16" font-weight="700" fill="#1F2328">Инвестор против Скептика: стоит ли поднимать всем одинаково</text>
  <g font-size="15" fill="#1F2328">
    <text x="58" y="198"><tspan font-weight="600">Инвестор:</tspan> даже уход двух средних клиентов оставляет +330 000 ₽ в месяц,</text>
    <text x="58" y="220">а до потери 13% выручки решение не делает вас беднее.</text>
    <text x="58" y="246"><tspan font-weight="600">Скептик:</tspan> клиент из топ-3 — это в среднем 13% выручки. Уход одного съедает</text>
    <text x="58" y="268">весь эффект, а февральское продление — ровно тот момент, когда это случится.</text>
  </g>
  <text x="58" y="296" font-size="15" fill="#59636E"><tspan font-weight="600" fill="#1F2328">Решает:</tspan> реакция топ-3 на личный разговор до общего объявления.</text>

  <!-- Вердикт -->
  <text x="40" y="340" font-size="12" font-weight="600" letter-spacing="1.2" fill="#59636E">ВЕРДИКТ</text>
  <rect x="40" y="352" width="190" height="30" rx="15" fill="#E3F0E9"/>
  <text x="135" y="372" font-size="14" font-weight="700" fill="#1F4E3D" text-anchor="middle">делать при условиях</text>
  <g font-size="15" fill="#1F2328">
    <text x="40" y="410">Текущим клиентам, кроме топ-3, — плюс 15% с 1 января. С топ-3 собственник</text>
    <text x="40" y="432">договаривается лично до продления: годовой договор с повышением на 8–10%.</text>
  </g>

  <!-- Условия выхода -->
  <text x="40" y="476" font-size="12" font-weight="600" letter-spacing="1.2" fill="#59636E">УСЛОВИЯ ВЫХОДА</text>
  <rect x="40" y="488" width="880" height="122" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <path d="M40.5 496 a8 8 0 0 1 8 -8 h863 a8 8 0 0 1 8 8 v24 h-879z" fill="#F6F8FA"/>
  <line x1="40" y1="520" x2="920" y2="520" stroke="#D0D7DE"/>
  <line x1="40" y1="565" x2="920" y2="565" stroke="#D8DEE4"/>
  <g font-size="13" font-weight="600" fill="#59636E">
    <text x="56" y="509">Метрика</text>
    <text x="400" y="509">Порог</text>
    <text x="530" y="509">Срок</text>
    <text x="680" y="509">Действие</text>
  </g>
  <g font-size="14" fill="#1F2328">
    <text x="56" y="548">Отток клиентов без топ-3</text>
    <text x="400" y="548">больше 12%</text>
    <text x="530" y="548">первые 6 недель</text>
    <text x="680" y="548">откатываем до +7%</text>
    <text x="56" y="593">Топ-3 просит КП у других студий</text>
    <text x="400" y="593">любой из трёх</text>
    <text x="530" y="593">до продления</text>
    <text x="680" y="593">цена на год без повышения</text>
  </g>

  <!-- Прогноз -->
  <text x="40" y="652" font-size="12" font-weight="600" letter-spacing="1.2" fill="#59636E">ПРОГНОЗ</text>
  <text x="40" y="682" font-size="16" fill="#1F2328">Отток клиентов за I квартал 2027 года не больше 8%</text>
  <rect x="452" y="663" width="58" height="26" rx="13" fill="#FFF4D6"/>
  <text x="481" y="681" font-size="14" font-weight="700" fill="#8A5A00" text-anchor="middle">70%</text>
  <text x="524" y="682" font-size="15" fill="#59636E">проверка 2027-04-01</text>

  <text x="40" y="720" font-size="13" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">Запись добавлена в kvorum/journal.md</text>
</svg>
